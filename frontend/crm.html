<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM | TrendWear Distribution ERP</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <div class="brand-logo">TW</div>
            <div>
                <h2>TrendWear Distribution Ltd</h2>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-top: 0.25rem;">Customer Relationship Management</p>
            </div>
        </div>
        <nav>
            <a href="dashboard.html" class="nav-link"><i data-lucide="layout-dashboard"></i> Dashboard</a>
            <a href="crm.html" class="nav-link active"><i data-lucide="users"></i> CRM (Mijozlar)</a>
            <a href="erp.html" class="nav-link"><i data-lucide="shopping-cart"></i> ERP (Buyurtmalar)</a>
            <a href="wms.html" class="nav-link"><i data-lucide="package"></i> WMS (Ombor)</a>
        </nav>
        <div style="position: absolute; bottom: 1.5rem; width: calc(100% - 3rem);">
            <button onclick="logout()" class="btn btn-danger" style="background: transparent; border: 1px solid var(--danger); color: var(--danger);">
                <i data-lucide="log-out"></i> Chiqish
            </button>
        </div>
    </div>

    <div class="main-content">
        <header class="flex justify-between items-center mb-4">
            <div>
                <h1>Mijozlar (CRM)</h1>
                <p style="color: var(--text-muted);">Mijozlar bazasi va ular bilan aloqalar</p>
            </div>
            <button onclick="openModal()" class="btn btn-primary"><i data-lucide="plus"></i> Yangi mijoz</button>
        </header>

        <div class="card">
            <table id="customers-table">
                <thead>
                    <tr>
                        <th>Kampaniya</th>
                        <th>Kontakt shaxs</th>
                        <th>Telefon</th>
                        <th>Status</th>
                        <th>Amallar</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Data will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="notification-container"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        async function loadCustomers() {
            try {
                const customers = await API.getCustomers();
                const tbody = document.querySelector('#customers-table tbody');
                
                if (customers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">Mijozlar topilmadi</td></tr>';
                    return;
                }

                tbody.innerHTML = customers.map(c => `
                    <tr>
                        <td><strong>${c.company_name}</strong></td>
                        <td>${c.contact_person}</td>
                        <td>${c.phone}</td>
                        <td><span class="badge badge-success">Faol</span></td>
                        <td>
                            <button class="btn" style="padding: 0.5rem; width: auto;"><i data-lucide="edit-2"></i></button>
                        </td>
                    </tr>
                `).join('');
                lucide.createIcons();
            } catch (err) {
                console.error(err);
                showNotification('Mijozlarni yuklashda xatolik', 'error');
            }
        }

        loadCustomers();
    </script>
</body>
</html>
